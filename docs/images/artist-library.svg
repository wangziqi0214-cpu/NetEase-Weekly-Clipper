<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">艺人资料库悬停卡片示意图</title>
  <desc id="desc">审核表格中的艺人名称触发本地艺人资料卡，显示风格、来源和摘要。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#080b12"/><stop offset="1" stop-color="#172033"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".4"/></filter></defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="34" y="36" width="1132" height="628" rx="16" fill="#101520" stroke="#2b3449"/>
  <text x="70" y="86" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700">候选审阅 · 艺人资料库</text><text x="70" y="113" fill="#64748b" font-family="sans-serif" font-size="12">鼠标指向艺人名即可读取本地缓存，不在审核时实时发起搜索</text>
  <rect x="70" y="150" width="650" height="430" rx="10" fill="#141a25" stroke="#273148"/>
  <rect x="70" y="150" width="650" height="46" rx="10" fill="#1b2231"/><g fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600"><text x="92" y="179">歌曲</text><text x="285" y="179">艺人</text><text x="495" y="179">本地画像</text><text x="630" y="179">状态</text></g>
  <g font-family="sans-serif" font-size="13"><rect x="70" y="196" width="650" height="72" fill="#111722"/><text x="92" y="237" fill="#e2e8f0">夜航星</text><text x="285" y="237" fill="#93c5fd" text-decoration="underline">Schoolgirl Byebye</text><rect x="495" y="220" width="82" height="24" rx="5" fill="#103b32"/><text x="509" y="237" fill="#6ee7b7" font-size="11">已收录</text><text x="630" y="237" fill="#6ee7b7">✓</text>
  <rect x="70" y="268" width="650" height="72" fill="#151b27"/><text x="92" y="309" fill="#e2e8f0">潮汐之间</text><text x="285" y="309" fill="#cbd5e1">理想混蛋</text><rect x="495" y="292" width="82" height="24" rx="5" fill="#211b12"/><text x="509" y="309" fill="#fbbf24" font-size="11">待补全</text><text x="630" y="309" fill="#fbbf24">…</text>
  <rect x="70" y="340" width="650" height="72" fill="#111722"/><text x="92" y="381" fill="#e2e8f0">山风吹过乌云朵</text><text x="285" y="381" fill="#cbd5e1">象乐队</text><rect x="495" y="364" width="82" height="24" rx="5" fill="#172554"/><text x="509" y="381" fill="#93c5fd" font-size="11">稀疏待查</text><text x="630" y="381" fill="#fbbf24">…</text>
  <rect x="70" y="412" width="650" height="72" fill="#151b27"/><text x="92" y="453" fill="#e2e8f0">凌晨四点</text><text x="285" y="453" fill="#cbd5e1">独立计划</text><rect x="495" y="436" width="82" height="24" rx="5" fill="#103b32"/><text x="509" y="453" fill="#6ee7b7" font-size="11">已收录</text><text x="630" y="453" fill="#6ee7b7">✓</text></g>

  <g filter="url(#shadow)"><rect x="662" y="205" width="450" height="366" rx="12" fill="#121a2a" stroke="#43516d"/><rect x="662" y="205" width="450" height="66" rx="12" fill="#19243a"/><circle cx="702" cy="238" r="20" fill="#2563eb"/><path d="M693 238h18M702 229v18" stroke="#dbeafe" stroke-width="3" stroke-linecap="round"/><text x="738" y="235" fill="#f8fafc" font-family="sans-serif" font-size="17" font-weight="700">Schoolgirl Byebye</text><text x="738" y="255" fill="#60a5fa" font-family="sans-serif" font-size="11">艺人资料 · 本地缓存</text>
    <text x="688" y="303" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">音乐身份</text><rect x="688" y="318" width="76" height="24" rx="5" fill="#172554"/><text x="702" y="335" fill="#93c5fd" font-family="sans-serif" font-size="11">乐队</text><rect x="774" y="318" width="76" height="24" rx="5" fill="#103b32"/><text x="787" y="335" fill="#6ee7b7" font-family="sans-serif" font-size="11">独立</text><rect x="860" y="318" width="86" height="24" rx="5" fill="#211b12"/><text x="875" y="335" fill="#fbbf24" font-family="sans-serif" font-size="11">低不确定</text>
    <text x="688" y="372" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">资料摘要</text><text x="688" y="396" fill="#94a3b8" font-family="sans-serif" font-size="12">来自公开检索的乐队背景、风格与发行信息。</text><text x="688" y="417" fill="#94a3b8" font-family="sans-serif" font-size="12">资料先写入 SQLite，审核时只读取本地内容。</text>
    <text x="688" y="456" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">已验证来源</text><rect x="688" y="470" width="78" height="23" rx="5" fill="#064e3b"/><text x="701" y="486" fill="#6ee7b7" font-family="sans-serif" font-size="10">Spotify</text><rect x="776" y="470" width="86" height="23" rx="5" fill="#3f1d2e"/><text x="789" y="486" fill="#f9a8d4" font-family="sans-serif" font-size="10">Instagram</text><rect x="872" y="470" width="86" height="23" rx="5" fill="#3f1515"/><text x="885" y="486" fill="#fca5a5" font-family="sans-serif" font-size="10">YouTube</text><rect x="968" y="470" width="84" height="23" rx="5" fill="#172554"/><text x="981" y="486" fill="#93c5fd" font-family="sans-serif" font-size="10">StreetVoice</text>
    <text x="688" y="532" fill="#475569" font-family="sans-serif" font-size="10">若资料稀疏，不会自动否决，只会保留人工审核。</text>
  </g>
</svg>
