<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">从新歌发现到视频交付的完整流程</title>
  <desc id="desc">三平台采集经过去重初筛、艺人资料、本人工审核、网易云歌单和视频文案交付。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#080b12"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#a855f7"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
  <rect width="1400" height="520" fill="url(#bg)"/>
  <text x="70" y="68" fill="#f8fafc" font-family="sans-serif" font-size="25" font-weight="700">一条从发现到交付的本地生产流水线</text><text x="70" y="96" fill="#64748b" font-family="sans-serif" font-size="13">三平台新发行 → 人工精审 → 网易云歌单 → 视频与文案</text>
  <path d="M170 255H1225" stroke="url(#line)" stroke-width="5" stroke-linecap="round" opacity=".5"/>
  <g font-family="sans-serif" text-anchor="middle">
    <g><circle cx="150" cy="255" r="67" fill="#10203c" stroke="#3b82f6" stroke-width="2"/><text x="150" y="240" fill="#93c5fd" font-size="14" font-weight="700">三平台</text><text x="150" y="263" fill="#f8fafc" font-size="15" font-weight="700">新歌发现</text><text x="150" y="288" fill="#64748b" font-size="11">QQ · 网易 · KKBOX</text></g>
    <g><circle cx="400" cy="255" r="67" fill="#16251f" stroke="#34d399" stroke-width="2"/><text x="400" y="240" fill="#6ee7b7" font-size="14" font-weight="700">规范化</text><text x="400" y="263" fill="#f8fafc" font-size="15" font-weight="700">去重与核验</text><text x="400" y="288" fill="#64748b" font-size="11">繁简 · 发行日 · 版本</text></g>
    <g><circle cx="650" cy="255" r="67" fill="#211b12" stroke="#f59e0b" stroke-width="2"/><text x="650" y="240" fill="#fbbf24" font-size="14" font-weight="700">机筛 + 资料库</text><text x="650" y="263" fill="#f8fafc" font-size="15" font-weight="700">候选分层</text><text x="650" y="288" fill="#64748b" font-size="11">AGy 研究 · 保守拦截</text></g>
    <g><circle cx="900" cy="255" r="67" fill="#26193b" stroke="#a855f7" stroke-width="2"/><text x="900" y="240" fill="#d8b4fe" font-size="14" font-weight="700">人工审核</text><text x="900" y="263" fill="#f8fafc" font-size="15" font-weight="700">排序与定稿</text><text x="900" y="288" fill="#64748b" font-size="11">批量选择 · 统一登记</text></g>
    <g><circle cx="1150" cy="255" r="67" fill="#10251f" stroke="#10b981" stroke-width="2"/><text x="1150" y="240" fill="#6ee7b7" font-size="14" font-weight="700">交付</text><text x="1150" y="263" fill="#f8fafc" font-size="15" font-weight="700">歌单 / 视频 / 文案</text><text x="1150" y="288" fill="#64748b" font-size="11">顺序一致 · 可追踪</text></g>
  </g>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M220 255H320"/><path d="M470 255H570"/><path d="M720 255H820"/><path d="M970 255H1070"/></g>
  <g font-family="sans-serif" font-size="12"><rect x="515" y="392" width="370" height="62" rx="10" fill="#151925" stroke="#2d3850"/><text x="540" y="418" fill="#cbd5e1" font-weight="600">安全边界</text><text x="540" y="440" fill="#64748b">资料缺失、AGy 限额或匹配存疑时，保留人工审核，不误杀。</text></g>
</svg>
